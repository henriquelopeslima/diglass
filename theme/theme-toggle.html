<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
  <span class="theme-toggle-bracket">[</span>
  <span class="theme-toggle-icon">
    <svg class="theme-svg theme-svg-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </span>
  <span class="theme-toggle-bracket">]</span>
</button>

<script>
(function() {
  var toggleBtn = document.getElementById('theme-toggle');
  if (!toggleBtn) return;

  var moonSvg = '<svg class="theme-svg theme-svg-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
  var sunSvg = '<svg class="theme-svg theme-svg-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';

  function updateToggleUI(theme) {
    var isLight = theme === 'light';
    var iconEl = toggleBtn.querySelector('.theme-toggle-icon');
    if (iconEl) {
      iconEl.innerHTML = isLight ? sunSvg : moonSvg;
    }
    var nextTheme = isLight ? 'escuro' : 'claro';
    toggleBtn.setAttribute('title', 'Alternar para tema ' + nextTheme);
    toggleBtn.setAttribute('aria-label', 'Tema atual: ' + (isLight ? 'claro' : 'escuro') + '. Clique para alternar para ' + nextTheme);
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem('diglass-theme', theme);
    } catch (e) {}
    updateToggleUI(theme);
    window.dispatchEvent(new CustomEvent('diglass-theme-change', { detail: { theme: theme } }));
  }

  var currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  updateToggleUI(currentTheme);

  toggleBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    toggleBtn.blur();
  });

  window.addEventListener('storage', function(e) {
    if (e.key === 'diglass-theme' && (e.newValue === 'light' || e.newValue === 'dark')) {
      document.documentElement.setAttribute('data-theme', e.newValue);
      updateToggleUI(e.newValue);
    }
  });
})();
</script>
