project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "modulos/*.qmd"
    - "aulas/*.qmd"

website:
  title: "Full Cycle"

format:
  html:
    css: theme/blueprint-terracota-site.css
    theme: none
    page-layout: article
    anchor-sections: false
    include-in-header:
      - file: theme/theme-head.html
    include-after-body:
      - file: theme/theme-toggle.html
  revealjs:
    css: theme/blueprint-terracota.css
    theme: night
    include-in-header:
      - file: theme/theme-head.html
    include-after-body:
      - file: theme/theme-toggle.html
    slide-level: 2
    width: 1280
    height: 720
    margin: 0
    center: false
    controls: false
    progress: true
    slide-number: c/t
    transition: fade
    background-transition: slide
    incremental: true
    highlight-style: monokai
